<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass Studios — GDD Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0f;--bg2:#111115;--bg3:#16161c;--bg4:#1c1c24;--bg5:#22222c;
  --border:#2a2a38;--border2:#363648;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5e0a0;
  --text:#e8e4d8;--text2:#a8a49a;--text3:#6a6660;
  --red:#c94c4c;--green:#4c9c6a;--amber:#c98a4c;--blue:#4c7ec9;--purple:#7c4cc9;
  --sidebar:220px;
}
body{font-family:'Crimson Pro',serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:auto;height:auto}
.app{display:flex;flex-direction:column;min-height:100vh}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:16px;padding:0 20px;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.compass-icon{width:28px;height:28px;position:relative}
.compass-icon svg{width:28px;height:28px}
.logo-text{font-family:'Cinzel',serif;font-size:15px;font-weight:600;color:var(--gold2);letter-spacing:0.08em}
.logo-sub{font-size:11px;color:var(--text3);letter-spacing:0.12em;font-family:'Cinzel',serif;font-weight:400}
.topbar-spacer{flex:1}
.topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.user-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0d0d0f;font-family:'Cinzel',serif}
.btn{padding:6px 14px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'Crimson Pro',serif;font-size:13px;cursor:pointer;transition:all 0.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);color:#0d0d0f;border-color:var(--gold);font-weight:500}
.btn-gold:hover{background:var(--gold2);border-color:var(--gold2);color:#0d0d0f}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-section{padding:12px 0}
.sidebar-section+.sidebar-section{border-top:1px solid var(--border)}
.sidebar-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.18em;color:var(--text3);padding:0 14px 6px;font-weight:600}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.12s;position:relative;user-select:none;border-left:2px solid transparent}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:var(--bg4);color:var(--gold2);border-left-color:var(--gold)}
.sidebar-item svg{width:14px;height:14px;flex-shrink:0;opacity:0.7}
.sidebar-item.active svg{opacity:1}
.page-del{display:none;margin-left:auto;padding:1px 4px;font-size:11px;border-radius:2px;color:var(--text3);background:none;border:none;cursor:pointer}
.sidebar-item:hover .page-del{display:block}
.page-del:hover{color:var(--red)}
.add-page-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--text3);transition:all 0.12s;border:none;background:transparent;width:100%;text-align:left;font-family:'Crimson Pro',serif}
.add-page-btn:hover{color:var(--gold);background:var(--bg3)}
.sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border2)}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* PAGE EDITOR */
.page-editor{max-width:860px;margin:0 auto;padding:40px 40px 120px}
.page-title-input{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--gold2);background:transparent;border:none;outline:none;width:100%;margin-bottom:6px;letter-spacing:0.04em}
.page-title-input::placeholder{color:var(--text3)}
.page-meta{font-size:12px;color:var(--text3);margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:12px;display:flex;align-items:center;gap:12px}

/* BLOCKS */
.blocks{display:flex;flex-direction:column;gap:12px}
.block{position:relative;border-radius:4px;border:1px solid transparent;transition:border-color 0.12s}
.block:hover{border-color:var(--border)}
.block-toolbar{display:none;position:absolute;top:-1px;right:0;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 4px;gap:4px;z-index:10;align-items:center}
.block:hover .block-toolbar{display:flex}
.block-btn{background:transparent;border:none;cursor:pointer;padding:3px 5px;color:var(--text3);font-size:11px;border-radius:2px;font-family:'Crimson Pro',serif}
.block-btn:hover{background:var(--bg4);color:var(--gold)}
.block-btn.del:hover{color:var(--red)}

/* TEXT BLOCK */
.text-block textarea{width:100%;background:transparent;border:none;outline:none;resize:none;font-family:'Crimson Pro',serif;font-size:16px;color:var(--text);line-height:1.8;min-height:40px;padding:8px 10px}
.text-block textarea::placeholder{color:var(--text3)}

/* HEADING BLOCK */
.heading-block input{width:100%;background:transparent;border:none;outline:none;font-family:'Cinzel',serif;font-weight:600;color:var(--gold3);padding:8px 10px;letter-spacing:0.04em}
.heading-block.h1 input{font-size:22px}
.heading-block.h2 input{font-size:17px;color:var(--gold2)}
.heading-block.h3 input{font-size:14px;color:var(--text2);font-family:'Crimson Pro',serif;font-weight:500;letter-spacing:0.08em;text-transform:uppercase}
.heading-block.h2::before{content:'';display:block;width:100%;height:1px;background:linear-gradient(to right,var(--gold),transparent);margin-bottom:6px;opacity:0.3}

/* TABLE BLOCK */
.table-block{overflow-x:auto;padding:8px}
.block-table{border-collapse:collapse;width:100%;min-width:400px}
.block-table th{background:var(--bg3);border:1px solid var(--border);padding:8px 12px;text-align:left;font-family:'Cinzel',serif;font-size:11px;font-weight:600;letter-spacing:0.1em;color:var(--gold);white-space:nowrap}
.block-table th input{background:transparent;border:none;outline:none;font-family:'Cinzel',serif;font-size:11px;font-weight:600;color:var(--gold);width:100%;letter-spacing:0.1em}
.block-table td{border:1px solid var(--border);padding:6px 10px;vertical-align:top}
.block-table td input,.block-table td textarea{background:transparent;border:none;outline:none;font-family:'Crimson Pro',serif;font-size:14px;color:var(--text);width:100%;resize:none;min-height:28px;line-height:1.5}
.table-controls{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--border)}
.table-controls button{font-size:11px;padding:3px 8px}

/* IMAGE BLOCK */
.image-block{padding:8px}
.image-drop{border:1px dashed var(--border2);border-radius:4px;padding:30px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg2)}
.image-drop:hover{border-color:var(--gold);background:var(--bg3)}
.image-drop p{font-size:13px;color:var(--text3)}
.image-drop .icon{font-size:24px;margin-bottom:6px;opacity:0.4}
.image-preview{text-align:center}
.image-preview img{max-width:100%;border-radius:4px;border:1px solid var(--border)}
.image-caption{margin-top:6px}
.image-caption input{width:100%;background:transparent;border:none;outline:none;font-family:'Crimson Pro',serif;font-size:13px;color:var(--text3);text-align:center;font-style:italic;padding:4px}

/* ADD BLOCK MENU */
.add-block-area{margin-top:16px;position:relative}
.add-block-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px dashed var(--border);border-radius:4px;background:transparent;color:var(--text3);font-family:'Crimson Pro',serif;font-size:13px;cursor:pointer;width:100%;transition:all 0.15s}
.add-block-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--bg2)}
.block-menu{position:absolute;bottom:calc(100% + 4px);left:0;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px;min-width:220px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.6)}
.block-menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer;color:var(--text2);font-size:13px;transition:all 0.1s}
.block-menu-item:hover{background:var(--bg4);color:var(--gold)}
.block-menu-item .bm-icon{font-size:16px;width:20px;text-align:center;color:var(--gold);opacity:0.7}
.block-menu-item:hover .bm-icon{opacity:1}
.block-menu-sep{height:1px;background:var(--border);margin:4px 0}
.block-menu-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.15em;color:var(--text3);padding:4px 10px}

/* PRODUCTION BOARD */
.production{padding:32px 40px;max-width:1000px;margin:0 auto}
.prod-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.prod-title{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold2)}
.milestone-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
.milestone-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none}
.milestone-header:hover{background:var(--bg3)}
.m-name{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--gold2);flex:1}
.m-progress{display:flex;align-items:center;gap:8px}
.progress-bar{width:80px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.3s}
.m-pct{font-size:11px;color:var(--text3);min-width:32px}
.m-status-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em}
.badge-active{background:rgba(201,168,76,0.12);color:var(--gold);border:1px solid rgba(201,168,76,0.3)}
.badge-done{background:rgba(76,156,106,0.12);color:var(--green);border:1px solid rgba(76,156,106,0.3)}
.badge-pending{background:rgba(106,102,96,0.12);color:var(--text3);border:1px solid var(--border)}
.badge-blocked{background:rgba(201,76,76,0.12);color:var(--red);border:1px solid rgba(201,76,76,0.3)}
.tasks-container{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg3);border-radius:4px;border:1px solid var(--border);font-size:13px}
.task-name{flex:1;color:var(--text)}
.task-name input{background:transparent;border:none;outline:none;color:var(--text);font-family:'Crimson Pro',serif;font-size:13px;width:100%}
.task-assignee{width:90px}
.task-assignee select{background:var(--bg4);border:1px solid var(--border);border-radius:3px;color:var(--text2);font-size:11px;padding:2px 4px;font-family:'Crimson Pro',serif;outline:none;width:100%}
.task-status select{background:var(--bg4);border:1px solid var(--border);border-radius:3px;font-size:11px;padding:2px 4px;font-family:'JetBrains Mono',monospace;outline:none;width:80px}
.task-del{background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 4px;border-radius:2px}
.task-del:hover{color:var(--red)}
.add-task-row{display:flex;align-items:center;gap:8px;padding:4px 10px}
.add-task-input{flex:1;background:transparent;border:none;outline:none;color:var(--text3);font-family:'Crimson Pro',serif;font-size:13px}
.add-task-input::placeholder{color:var(--text3);opacity:0.6}
.add-milestone-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--text3);font-family:'Cinzel',serif;font-size:11px;cursor:pointer;width:100%;margin-top:8px;letter-spacing:0.1em;transition:all 0.15s}
.add-milestone-btn:hover{border-color:var(--gold);color:var(--gold)}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.kanban-col{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:120px}
.kanban-col-header{padding:10px 12px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--text3);display:flex;align-items:center;justify-content:space-between}
.kanban-cards{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.kanban-card{background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--text);border-left-width:2px}
.kanban-card.col-todo{border-left-color:var(--text3)}
.kanban-card.col-inprog{border-left-color:var(--gold)}
.kanban-card.col-review{border-left-color:var(--blue)}
.kanban-card.col-done{border-left-color:var(--green)}
.kanban-card.col-blocked{border-left-color:var(--red)}
.kc-name{font-family:'Crimson Pro',serif;margin-bottom:3px}
.kc-meta{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* AUTH SCREEN */
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column}
.auth-box{width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:40px;position:relative}
.auth-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:0.5}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold2);letter-spacing:0.08em;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text3);font-style:italic}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.15em;color:var(--text3);margin-bottom:6px}
.auth-field input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:9px 12px;color:var(--text);font-family:'Crimson Pro',serif;font-size:15px;outline:none;transition:border-color 0.15s}
.auth-field input:focus{border-color:var(--gold)}
.auth-error{color:var(--red);font-size:12px;margin-bottom:12px;text-align:center}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px}
.auth-tab{flex:1;padding:8px;background:transparent;border:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.auth-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* PERMISSIONS */
.permissions-panel{padding:32px 40px;max-width:700px;margin:0 auto}
.perm-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:var(--gold2);margin-bottom:20px}
.perm-invite-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.perm-invite-row input{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px 12px;color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;outline:none}
.perm-invite-row input:focus{border-color:var(--gold)}
.perm-invite-row select{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px 12px;color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;outline:none}
.perm-user-list{display:flex;flex-direction:column;gap:8px}
.perm-user{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;flex-wrap:wrap}
.perm-user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Cinzel',serif;flex-shrink:0}
.perm-user-info{flex:1;min-width:120px}
.perm-user-name{font-size:14px;color:var(--text);font-weight:500}
.perm-user-role覆{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px}
.perm-user-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.perm-badge-owner{background:rgba(201,168,76,0.15);color:var(--gold);border:1px solid rgba(201,168,76,0.4)}
.perm-badge-editor{background:rgba(76,126,201,0.12);color:var(--blue);border:1px solid rgba(76,126,201,0.3)}
.perm-badge-viewer{background:rgba(106,102,96,0.12);color:var(--text3);border:1px solid var(--border)}

/* PROD TABS */
.prod-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.prod-tab{padding:8px 16px;background:transparent;border:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.prod-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:28px;width:400px;position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:0.5}
.modal-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;color:var(--gold2);margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.15em;color:var(--text3);margin-bottom:5px}
.modal-field input,.modal-field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:7px 10px;color:var(--text);font-family:'Crimson Pro',serif;font-size:14px;outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:var(--gold)}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.divider{height:1px;background:var(--border);margin:20px 0}
.hidden{display:none!important}
@media (max-width:1040px){
  .main{flex-direction:column;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .sidebar-scroll{max-height:260px;}
  .content{overflow:visible;}
  .page-editor{padding:32px 24px 100px;}
  .production{padding:28px 24px;}
  .permissions-panel{padding:28px 24px;}
  .auth-box{width:100%;max-width:440px;margin:18px auto;}
  .prod-header{flex-wrap:wrap;gap:10px;}
  .page-meta{flex-wrap:wrap;gap:10px;}
  .auth-tabs{flex-wrap:wrap;}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;height:auto;padding:12px 16px;}
  .topbar-user{width:100%;justify-content:space-between;}
  .logo{width:100%;justify-content:space-between;}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);}
  .sidebar-item,.add-page-btn{font-size:12px;}
  .page-editor{padding:24px 16px 80px;}
  .page-title-input{font-size:24px;}
  .page-meta{flex-direction:column;align-items:flex-start;}
  .prod-header{flex-direction:column;align-items:flex-start;}
  .task-row{flex-direction:column;align-items:flex-start;gap:8px;}
  .task-assignee,.task-status select{width:100%;}
  .perm-invite-row{flex-direction:column;align-items:flex-start;}
  .perm-invite-row input,.perm-invite-row select{width:100%;}
  .auth-box{padding:26px 18px;}
  .auth-field input{font-size:14px;padding:10px 12px;}
  .kanban{grid-template-columns:1fr;}
  .kanban-col{min-width:auto;}
  .prod-title{font-size:20px;}
}
input,textarea,select{font-family:'Crimson Pro',serif}
</style>
</head>
<body>
<div id="root"></div>

<script>
const OWNERS = [
  {id:'owner1',name:'Mohamed',email:'owner1@compass.studio',color:'#c9a84c',initials:'M',role:'owner',title:'Creative Director'},
  {id:'owner2',name:'Smith Todd',email:'owner2@compass.studio',color:'#4c7ec9',initials:'ST',role:'owner',title:'Game Director'}
];
const OWNER_PASSWORDS = {owner1:'compass1',owner2:'compass2'};

function save(){
  saveData({pages:state.pages,milestones:state.milestones,users:state.users,auth:state.auth});
}
function load(){
  const d=loadData();
  if(d){
    if(d.pages) state.pages=d.pages;
    if(d.milestones) state.milestones=d.milestones;
    if(d.users) state.users=d.users;
    OWNERS.forEach(o=>{
      const idx=state.users.findIndex(u=>u.id===o.id);
      if(idx===-1) state.users.unshift({...o});
      else state.users[idx] = {...state.users[idx], ...o};
    });
    if(d.auth){
      const authUser = state.users.find(u=>u.id===d.auth.id) || state.users.find(u=>u.email===d.auth.email);
      if(authUser) state.auth = authUser;
      else state.auth = d.auth;
    }
  }
}

window.submitAuth=()=>{
  const err=document.getElementById('auth-err');
  if(activeAuthTab==='owner'){
    const id=document.getElementById('auth-owner-id').value;
    const pass=document.getElementById('auth-pass').value;
    if(OWNER_PASSWORDS[id]===pass){
      state.auth = state.users.find(u=>u.id===id);
      save();render();
    } else { err.textContent='Invalid access key for this director profile.'; }
  } else {
    const code=document.getElementById('auth-code').value.trim().toUpperCase();
    const nameInput=document.getElementById('auth-team-name').value.trim();
    if(!code){err.textContent='Please fill in your assignment code.';return;}
    const u=state.users.find(x=>String(x.inviteCode||'').toUpperCase()===code);
    if(u){
      if(!u.activated && nameInput){ u.name=nameInput; u.activated=true; }
      state.auth = u; save(); render();
    } else { err.textContent='Code not found in production registry.'; }
  }
};

  render();
};
window.createNewPage=()=>{
  const id=uid();
  state.pages.push({id,title:'Untitled Page',blocks:[{id:uid(),type:'heading',level:'h1',content:'Untitled Section'}]});
  state.currentPageId=id;state.currentView='pages';save();render();
};
window.deletePage=(id)=>{
  if(state.pages.length<=1)return;
  if(confirm('Are you sure you want to remove this documentation page?')){
    state.pages=state.pages.filter(p=>p.id!==id);
    if(state.currentPageId===id) state.currentPageId=state.pages[0].id;
    save();render();
  }
};

function renderBlock(block,idx,pid,canEdit){
  const toolbar=canEdit?`<div class="block-toolbar">
    <button class="block-btn" onclick="moveBlock('${pid}','${block.id}',-1)" title="Move up">↑</button>
    <button class="block-btn" onclick="moveBlock('${pid}','${block.id}',1)" title="Move down">↓</button>
    <button class="block-btn del" onclick="deleteBlock('${pid}','${block.id}')" title="Delete">✕</button>
  </div>`:'';
  
  if(block.type==='text')return `<div class="block text-block" id="blk-${block.id}">${toolbar}<textarea ${canEdit?'':'readonly'} oninput="updateBlock('${pid}','${block.id}','content',this.value);autoResize(this)" onblur="save()" placeholder="Write something…">${esc(block.content||'')}</textarea></div>`;
  if(block.type==='heading')return `<div class="block heading-block ${block.level}" id="blk-${block.id}">${toolbar}<input ${canEdit?'':'readonly'} value="${esc(block.content||'')}" placeholder="${block.level==='h1'?'Title':block.level==='h2'?'Section':'Subsection'}" oninput="updateBlock('${pid}','${block.id}','content',this.value)" onblur="save()"/></div>`;
  if(block.type==='table')return renderTableBlock(block,pid,canEdit,toolbar);
  if(block.type==='image')return renderImageBlock(block,pid,canEdit,toolbar);
  return '';
}

function renderTableBlock(block,pid,canEdit,toolbar){
  const headers=block.headers||['Column 1'];
  const rows=block.rows||[[]];
  return `<div class="block table-block" id="blk-${block.id}">${toolbar}
    <div style="overflow-x:auto">
      <table class="block-table">
        <thead><tr>
          ${headers.map((h,hi)=>`<th><input value="${esc(h)}" ${canEdit?'':'readonly'} placeholder="Column" oninput="updateTableHeader('${pid}','${block.id}',${hi},this.value)" onblur="save()"/></th>`).join('')}
          ${canEdit?`<th style="width:36px;text-align:center"><button class="block-btn" onclick="addTableCol('${pid}','${block.id}')" title="Add column" style="font-size:14px">+</button></th>`:''}
        </tr></thead>
        <tbody>
          ${rows.map((row,ri)=>`<tr>
            ${headers.map((_,ci)=>`<td><input value="${esc((row[ci]||''))}" ${canEdit?'':'readonly'} placeholder="—" oninput="updateTableCell('${pid}','${block.id}',${ri},${ci},this.value)" onblur="save()"/></td>`).join('')}
            ${canEdit?`<td style="text-align:center"><button class="block-btn del" onclick="removeTableRow('${pid}','${block.id}',${ri})" title="Remove row">✕</button></td>`:''}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="table-controls" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        ${canEdit?`<button class="btn btn-sm" onclick="addTableRow('${pid}','${block.id}')">+ Row</button>
        <button class="btn btn-sm btn-danger" onclick="removeTableCol('${pid}','${block.id}')">− Column</button>`:''}
      </div>
      <button class="btn btn-sm btn-gold" onclick="downloadTableCSV('${pid}','${block.id}')" title="Download spreadsheet layout as CSV format for programmers">⬇ CSV</button>
    </div>
  </div>`;
}

window.downloadTableCSV=(pid, bid)=>{
  const p = state.pages.find(x=>x.id===pid); if(!p) return;
  const b = p.blocks.find(x=>x.id===bid); if(!b||b.type!=='table') return;
  const headers = b.headers || [];
  const rows = b.rows || [];
  let csvContent = "";
  
  csvContent += headers.map(h => {
    let text = h.replace(/"/g, '""');
    return `"${text}"`;
  }).join(",") + "\r\n";
  
  rows.forEach(row => {
    csvContent += headers.map((_, ci) => {
      let val = row[ci] || '';
      let text = val.replace(/"/g, '""');
      return `"${text}"`;
    }).join(",") + "\r\n";
  });
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `${p.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_table_${bid}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

    </div>
  </div><div class="html2pdf__page-break"></div>`;
  
  state.pages.forEach((p, pIdx) => {
    htmlContent += `<h1 style="font-family:'Cinzel',serif; font-size:24px; border-bottom:2px solid #c9a84c; padding-bottom:6px; margin-top:30px; color:#0d0d0f;">${esc(p.title || 'Untitled Page')}</h1>`;
    p.blocks.forEach(b => {
      if(b.type === 'heading') {
        if(b.level === 'h1') htmlContent += `<h1 style="font-family:'Cinzel',serif; font-size:22px; margin-top:24px; color:#111;">${esc(b.content || '')}</h1>`;
        else if(b.level === 'h2') htmlContent += `<h2 style="font-family:'Cinzel',serif; font-size:17px; border-bottom:1px solid #ddd; padding-bottom:4px; margin-top:20px; color:#222;">${esc(b.content || '')}</h2>`;
        else htmlContent += `<h3 style="font-family:'Cinzel',serif; font-size:14px; margin-top:16px; color:#444; text-transform:uppercase;">${esc(b.content || '')}</h3>`;
      } else if(b.type === 'text') {
        htmlContent += `<p style="font-size:15px; white-space:pre-wrap; margin-bottom:12px; color:#222;">${esc(b.content || '')}</p>`;
      } else if(b.type === 'table') {
        const h = b.headers || [];
        const r = b.rows || [];
        htmlContent += `<table style="width:100%; border-collapse:collapse; margin:16px 0; font-size:13px;"><thead><tr>${h.map(head => `<th style="background:#f5f5f5; border:1px solid #bbb; padding:8px; font-family:'Cinzel',serif; text-align:left; font-weight:600;">${esc(head)}</th>`).join('')}</tr></thead><tbody>`;
        r.forEach(row => {
          htmlContent += `<tr>${h.map((_, ci) => `<td style="border:1px solid #bbb; padding:8px; vertical-align:top;">${esc(row[ci] || '')}</td>`).join('')}</tr>`;
        });
        htmlContent += `</tbody></table>`;
      } else if(b.type === 'image' && b.src) {
        htmlContent += `<div style="text-align:center; margin:18px 0;"><img src="${b.src}" style="max-width:80%; max-height:28px0px; border:1px solid #bbb;"/><br><span style="font-style:italic; font-size:12px; color:#555;">${esc(b.caption || '')}</span></div>`;
      }
    });
    if(pIdx < state.pages.length - 1) {
      htmlContent += `<div class="html2pdf__page-break"></div>`;
    }
  });
  
  element.innerHTML = htmlContent;

  const opt = {
    margin:       10,
    filename:     'project_gdd_bundle.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true, logging: false },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  // Run generation engine behind the scenes and immediately download file cleanly
  html2pdf().set(opt).from(element).save().then(() => {
    if(btn) { btn.textContent = 'Download Project PDF'; btn.style.pointerEvents = 'auto'; btn.style.opacity = '1'; }
  }).catch(err => {
    console.error(err);
    if(btn) { btn.textContent = 'Download Project PDF'; btn.style.pointerEvents = 'auto'; btn.style.opacity = '1'; }
  });
};

    <div class="image-preview">

      <div class="image-caption"><input value="${esc(block.caption||'')}" placeholder="Caption (optional)" ${canEdit?'':'readonly'} oninput="updateBlock('${pid}','${block.id}','caption',this.value)" onblur="save()"/></div>

    <div class="block-menu-item" onclick="addBlock('${pid}','heading-h3')"><span class="bm-icon" style="font-family:Cinzel,serif;font-size:12px">H3</span>Heading 3</div>
    <div class="block-menu-item" onclick="addBlock('${pid}','text')"><span class="bm-icon">¶</span>Text Block</div>

window.toggleBlockMenu=(e,pid)=>{
  e.stopPropagation();
  state.blockMenu=state.blockMenu===pid?null:pid;
  render();
};

window.addBlock=(pid,type)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  state.blockMenu=null;
  const id=uid();
  if(type.startsWith('heading-')){
    p.blocks.push({id,type:'heading',level:type.split('-')[1],content:''});
  } else if(type==='text'){
    p.blocks.push({id,type:'text',content:''});
  } else if(type==='table'){
    p.blocks.push({id,type:'table',headers:['Column 1','Column 2'],rows:[['',''],['','']]});
  } else if(type==='image'){
    p.blocks.push({id,type:'image',src:'',caption:''});
  }
  save();render();
  setTimeout(()=>{const el=document.querySelector(`#blk-${id} input, #blk-${id} textarea`);if(el)el.focus();},50);
};

window.updateBlock=(pid,bid,field,val)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b)b[field]=val;
};
window.updateTableHeader=(pid,bid,hi,val)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b&&b.headers)b.headers[hi]=val;
};
window.updateTableCell=(pid,bid,ri,ci,val)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b&&b.rows&&b.rows[ri])b.rows[ri][ci]=val;
};
window.addTableRow=(pid,bid)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b&&b.rows){b.rows.push(new Array(b.headers.length).fill(''));save();render();}
};
window.removeTableRow=(pid,bid,ri)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.idXX===bid);
  const realB = p.blocks.find(x=>x.id===bid);
  if(realB&&realB.rows&&realB.rows.length>1){realB.rows.splice(ri,1);save();render();}
};
window.addTableCol=(pid,bid)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b){
    b.headers.push('Column '+ (b.headers.length+1));
    b.rows.forEach(r=>r.push(''));
    save();render();
  }
};
window.removeTableCol=(pid,bid)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b&&b.headers.length>1){
    b.headers.pop();b.rows.forEach(r=>r.pop());save();render();
  }
};

window.deleteBlock=(pid,bid)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  p.blocks=p.blocks.filter(b=>b.id!==bid);save();render();
};
window.moveBlock=(pid,bid,dir)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const idx=p.blocks.findIndex(b=>b.id===bid);if(idx===-1)return;
  const nIdx=idx+dir;if(nIdx<0||nIdx>=p.blocks.length)return;
  const temp=p.blocks[idx];p.blocks[idx]=p.blocks[nIdx];p.blocks[nIdx]=temp;
  save();render();
};

window.triggerImageUpload=(pid,bid)=>{
  const el=document.getElementById(`img-inp-${bid}`);if(el)el.click();
};
window.handleImageFile=(e,pid,bid)=>{
  const file=e.target.files[0];if(file)processImage(file,pid,bid);
};
window.handleImageDrop=(e,pid,bid)=>{
  e.preventDefault();const file=e.dataTransfer.files[0];if(file)processImage(file,pid,bid);
};
function processImage(file,pid,bid){
  const r=new FileReader();
  r.onload=(event)=>{
    const p=state.pages.find(x=>x.id===pid);if(!p)return;
    const b=p.blocks.find(x=>x.id===bid);if(b){b.src=event.target.result;save();render();}
  };
  r.readAsDataURL(file);
}
window.removeImageSrc=(pid,bid)=>{
  const p=state.pages.find(x=>x.id===pid);if(!p)return;
  const b=p.blocks.find(x=>x.id===bid);if(b){b.src='';b.caption='';save();render();}
};

function getMilestoneProgress(m){if(!m.tasks.length)return 0;return Math.round(m.tasks.filter(t=>t.status==='done').length/m.tasks.length*100);}

function renderMilestones(){
  const isOwner=state.auth.role==='owner';
  const canEdit=isOwner||state.auth.role==='editor';
  return state.milestones.map(m=>{
    const pct=getMilestoneProgress(m);
    const exp=state.expandedMilestones[m.id];
    return `<div class="milestone-card">
      <div class="milestone-header" onclick="toggleMilestone('${m.id}')">
        <span style="font-size:12px;color:var(--text3);margin-right:4px">${exp?'▾':'▸'}</span>
        <span class="m-name">${esc(m.title)}</span>
        <div class="m-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="m-pct">${pct}%</span>
        </div>
        <span class="m-status-badge badge-${m.status==='done'?'done':m.status==='active'?'active':m.status==='blocked'?'blocked':'pending'}">${m.status.toUpperCase()}</span>
        ${isOwner?`<select onclick="event.stopPropagation()" onchange="updateMilestoneStatus('${m.id}',this.value)" style="margin-left:8px;background:var(--bg4);border:1px solid var(--border);border-radius:3px;color:var(--text2);font-size:11px;padding:2px 4px;font-family:JetBrains Mono,monospace;outline:none">
          <option value="pending" ${m.status==='pending'?'selected':''}>Pending</option>
          <option value="active" ${m.status==='active'?'selected':''}>Active</option>
          <option value="done" ${m.status==='done'?'selected':''}>Done</option>
          <option value="blocked" ${m.status==='blocked'?'selected':''}>Blocked</option>
        </select>
        <button onclick="event.stopPropagation();deleteMilestone('${m.id}')" style="background:transparent;border:none;cursor:pointer;color:var(--text3);padding:2px 8px;font-size:14px" title="Delete">✕</button>`:''}
      </div>
      ${exp?`<div class="tasks-container">
        ${m.tasks.map(t=>renderTaskRow(t,m.id,canEdit)).join('')}
        ${canEdit?`<div class="add-task-row">
          <input class="add-task-input" placeholder="+ Add task… (press Enter)" onkeydown="if(event.key==='Enter'&&this.value.trim()){addTask('${m.id}',this.value.trim());this.value='';}"/>
        </div>`:''}
      </div>`:''}
    </div>`;
  }).join('')+ `<button class="add-milestone-btn" onclick="openAddMilestoneModal()">+ ADD MILESTONE</button>`;
}

window.updateMilestoneStatus=(id,val)=>{ const m=state.milestones.find(x=>x.id===id);if(m)m.status=val;save();render(); };
window.deleteMilestone=(id)=>{ if(confirm('Delete milestone and all its grouped tasks?')){state.milestones=state.milestones.filter(x=>x.id!==id);save();render();} };

window.updateTask=(mid,tid,field,val)=>{ const m=state.milestones.find(x=>x.id===mid);if(m){const t=m.tasks.find(x=>x.id===tid);if(t)t[field]=val;} };
window.deleteTask=(mid,tid)=>{ const m=state.milestones.find(x=>x.id===mid);if(m){m.tasks=m.tasks.filter(x=>x.id!==tid);save();render();} };

      <div class="kanban-col-header"><span>${label}</span><span style="color:var(--text2)">${cols[key].length}</span></div>

window.sendInvite=()=>{
  const name=document.getElementById('inv-name').value.trim();
  const email=document.getElementById('inv-email').value.trim().toLowerCase();
  const role=document.getElementById('inv-role').value;
  const msg=document.getElementById('inv-msg');
  if(!name||!email){msg.textContent='Name and email required.';msg.style.color='var(--red)';return;}
  if(state.users.find(u=>u.email===email)){msg.textContent='User already exists.';msg.style.color='var(--red)';return;}
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  const initials=name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  const colors=['#4c7ec9','#4c9c6a','#c98a4c','#7c4cc9','#c94c7c'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  state.users.push({id:'u_'+uid(),name,email,role,color,initials,inviteCode:code,activated:false});
  save();render();
  const out=document.getElementById('inv-msg');
  out.textContent=`Registered! Assignment Key Code generated: ${code}`;out.style.color='var(--green)';
};

      <div class="modal-field"><label>STATUS</label><select id="m-status">
        <option value="pending">Pending</option>
        <option value="active">Active</option>
        <option value="done">Done</option>
        <option value="blocked">Blocked</option>
      </select></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-gold" onclick="confirmAddMilestone()">Create Milestone</button>
      </div>
    </div></div>`;
  }
  return '';
}
window.closeModal=()=>{state.modal=null;render();};
window.openAddMilestoneModal=()=>{state.modal='add-milestone';render();};
window.confirmAddMilestone=()=>{
  const title=document.getElementById('m-title').value.trim();
  const status=document.getElementById('m-status').value;
  if(!title)return;
  const id=uid();
  state.milestones.push({id,title,status,tasks:[]});
  state.expandedMilestones[id]=true;
  state.modal=null;save();render();
};

// ---- BIND ----
function bindApp(){
  document.querySelectorAll('textarea').forEach(el=>{
    el.style.height='auto';el.style.height=el.scrollHeight+'px';
  });
  window.autoResize=(target)=>{
    target.style.height='auto';target.style.height=target.scrollHeight+'px';
  };
}

document.addEventListener('click',()=>{if(state.blockMenu){state.blockMenu=null;render();}});

// ---- INITIAL SETUP ----
load();
render();
</script>
</body>
</html>
